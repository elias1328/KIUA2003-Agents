# Example config for a Debate scenario. Copy this per experiment and change ONE
# thing at a time (Week 3). Everything the engine needs lives here, no hard-coding.

topic: "Cities should ban private cars from their centres."

budget:
  max_turns: 8
  max_tokens: 4000
  max_seconds: 120

agents:
  - name: Pro
    system_prompt: >
      Debate topic: Cities should ban private cars from their centres.
      You argue IN FAVOUR. Make one concrete point per turn.
      Be brief: at most 2 sentences. Address the other speaker's last point.
    model: "llama3.2:3b"
    temperature: 0.7

  - name: Con
    system_prompt: >
      Debate topic: Cities should ban private cars from their centres.
      You argue AGAINST. Make one concrete point per turn.
      Be brief: at most 2 sentences. Address the other speaker's last point.
    model: "llama3.2:3b"
    temperature: 0.7

output: "transcripts/debate.json"
